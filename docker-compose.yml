version: '3.8'

services:
  modresorts-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: modresorts-backend:latest
    container_name: modresorts-backend
    ports:
      - "8080:8080"
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
      - TZ=UTC
      # Database connection (configure as needed)
      - DB_HOST=${DB_HOST:-localhost}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-modresorts}
      - DB_USER=${DB_USER:-admin}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config
    networks:
      - modresorts-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  modresorts-network:
    driver: bridge
