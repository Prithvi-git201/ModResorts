# Spring Boot Application Configuration for AWS Cloud Deployment

# Application Name
spring.application.name=modresorts

# Server Configuration (externalized via environment variables)
server.port=${SERVER_PORT:8080}

# AWS S3 Configuration
aws.s3.bucket-name=${S3_BUCKET_NAME:modresorts-data}

# AWS Secrets Manager Configuration
aws.secrets.weather-api-key=${WEATHER_API_KEY_SECRET:modresorts/weather-api-key}

# Redis Configuration for Amazon ElastiCache
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}

# Session Configuration with Redis
spring.session.store-type=redis
spring.session.redis.namespace=modresorts:session
spring.session.timeout=30m

# DataSource Configuration (HikariCP connection pooling)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/modresorts}
spring.datasource.username=${DB_USERNAME:modresorts}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# HikariCP Configuration for cloud-optimized connection pooling
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONN_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME:1800000}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Logging Configuration (structured for cloud monitoring)
logging.level.root=INFO
logging.level.com.acme.modres=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Actuator Configuration for health checks
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=true
management.health.db.enabled=true

# AWS Region Configuration
aws.region=${AWS_REGION:us-east-1}
