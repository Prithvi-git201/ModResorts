# Spring Boot Actuator Configuration for Containerization
# Health check endpoint for container orchestration (AWS ECS/EKS)

# Enable actuator endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Health check endpoint path
management.endpoints.web.base-path=/actuator
management.health.defaults.enabled=true

# Server configuration
server.port=${SERVER_PORT:8080}

# Application info
info.app.name=ModResorts
info.app.version=2.0.0
info.app.description=ModResorts Application - Containerized

# Environment-specific configurations
# Database configuration (externalized for containers)
spring.datasource.url=${DB_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# Redis configuration for distributed caching (ElastiCache)
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# Server discovery configuration
server.name=${SERVER_NAME:modresorts-server}
server.full.name=${SERVER_FULL_NAME:modresorts-server-instance}
